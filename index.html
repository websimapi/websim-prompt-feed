<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Infinite Scroll Feed</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Hide body scrollbars */
            background-color: #111;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        #feed-container {
            width: 100vw;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }

        .feed-item {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            background-color: #222;
            box-shadow: inset 0 0 100px 50px rgba(0,0,0,0.5); /* Vignette effect */
        }

        .feed-item .prompt-info {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 10px;
            margin-bottom: 50px;
            max-width: 80%;
            text-align: center;
            font-size: 1.2rem;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: opacity 0.3s ease-in-out;
        }

        .feed-item .user-info {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .user-info img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 10px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .user-info span {
            font-weight: bold;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
            font-size: 1.5rem;
            transition: opacity 0.5s ease;
        }
        
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="feed-container"></div>
    <div id="loading">
        <div class="spinner"></div>
        <p>Building your personalized feed...</p>
    </div>
    <script type="module">
        const feedContainer = document.getElementById('feed-container');
        const loadingIndicator = document.getElementById('loading');

        const MIN_AHEAD_BUFFER = 7;
        const PROMPT_BATCH_SIZE = 10;

        let isFetching = false;
        let promptsQueue = [];
        let user = null;

        async function getUserInterests(currentUser) {
            if (!currentUser) return 'The user is anonymous. Generate prompts based on generally popular, trending, and visually spectacular creative themes.';

            let interests = [];

            // 1. User's own projects
            try {
                const userProjects = await websim.getUserProjects(currentUser.username, { first: 10, posted: true, sort_by: 'updated_at' });
                userProjects.projects.data.forEach(p => {
                    if (p.project.title) interests.push(p.project.title);
                    if (p.site && p.site.prompt && p.site.prompt.text) {
                        interests.push(p.site.prompt.text);
                    }
                });
            } catch (e) {
                console.error("Couldn't fetch user projects:", e);
            }

            // 2. Projects from followed users
            try {
                const followingResponse = await websim.getUserFollowing(currentUser.username, { first: 5 });
                const followedUsers = followingResponse.following.data.map(f => f.follow.user);

                for (const followedUser of followedUsers) {
                    if (followedUser && followedUser.username) {
                        const followedProjects = await websim.getUserProjects(followedUser.username, { first: 5, posted: true, sort_by: 'updated_at' });
                        followedProjects.projects.data.forEach(p => {
                            if (p.project.title) interests.push(p.project.title);
                            if (p.site && p.site.prompt && p.site.prompt.text) {
                                interests.push(p.site.prompt.text);
                            }
                        });
                    }
                }
            } catch (e) {
                console.error("Couldn't fetch followed users' projects:", e);
            }

            // 3. User's liked projects
            try {
                const likedResponse = await websim.getUserLikes(currentUser.username, { first: 10 });
                likedResponse.likes.data.forEach(l => {
                    if (l.project && l.project.title) interests.push(l.project.title);
                    if (l.site && l.site.prompt && l.site.prompt.text) {
                        interests.push(l.site.prompt.text);
                    }
                });
            } catch(e) {
                console.error("Couldn't fetch user likes:", e);
            }

            if (interests.length > 0) {
                try {
                    const uniqueInterests = [...new Set(interests)].join(', ');
                    const completion = await websim.chat.completions.create({
                        messages: [{
                            role: 'system',
                            content: 'You are an assistant that summarizes a list of topics and prompts into a concise list of key themes and interests. Extract the core concepts. Respond with a comma-separated list of no more than 10-15 key themes.'
                        }, {
                            role: 'user',
                            content: `Here is a list of project titles and prompts from a user and people they follow: ${uniqueInterests}`
                        }],
                    });
                    return `The user has shown interest in the following topics: ${completion.content}.`;
                } catch(e) {
                    console.error("Error summarizing interests, using raw data:", e);
                    return `The user has shown interest in: ${[...new Set(interests)].slice(0, 20).join(', ')}.`;
                }
            }

            return `The user's username is '${currentUser.username}' and their description is '${currentUser.description}'. They haven't created, liked, or followed anyone with public projects yet, so generate prompts based on generally popular and trending creative themes.`;
        }

        async function fetchPrompts(currentUser, count) {
            console.log('Fetching new personalized prompts...');
            try {
                const userInterestSummary = await getUserInterests(currentUser);
                
                const completion = await websim.chat.completions.create({
                    messages: [{
                        role: 'system',
                        content: `You are a creative prompt generator for an AI image model. Your goal is to create a personalized, engaging, and endless vertical social media feed for a user.
                        ${userInterestSummary}
                        Based on this, generate ${count} unique and diverse prompts for visually stunning images. The prompts should be imaginative, ranging from fantasy landscapes to futuristic cityscapes, abstract art, and surreal concepts, while being tailored to the user's inferred interests. Also, introduce some related but new concepts to keep the feed fresh.
                        Respond with a JSON object following this schema: { "prompts": ["prompt1", "prompt2", ...] }`,
                    }, {
                        role: 'user',
                        content: `Generate ${count} prompts.`,
                    }],
                    json: true,
                });

                const result = JSON.parse(completion.content);
                if (result.prompts && Array.isArray(result.prompts)) {
                    promptsQueue.push(...result.prompts);
                    console.log(`Fetched ${result.prompts.length} new personalized prompts.`);
                }
            } catch (error) {
                console.error('Error fetching prompts:', error);
                // Add some fallback prompts
                promptsQueue.push(
                    "A neon-lit cyberpunk city street in the rain, with flying cars",
                    "An enchanted forest with glowing mushrooms and ethereal spirits",
                    "A majestic dragon flying over a volcanic landscape",
                    "An astronaut discovering an ancient alien artifact on Mars",
                    "A serene underwater city inhabited by merfolk",
                    "A surrealist painting of a clock melting over a desert landscape",
                    "A giant, crystalline tree in the center of a forgotten civilization"
                );
            }
        }

        async function addFeedItem() {
            if (promptsQueue.length === 0) {
                console.log('Prompt queue is empty, fetching more...');
                await fetchPrompts(user, PROMPT_BATCH_SIZE);
                if (promptsQueue.length === 0) {
                    console.error("Failed to add new item, no prompts available.");
                    return;
                }
            }

            const prompt = promptsQueue.shift();
            if (!prompt) return;

            const item = document.createElement('div');
            item.className = 'feed-item';
            
            const promptInfo = document.createElement('div');
            promptInfo.className = 'prompt-info';
            promptInfo.textContent = 'Generating...';
            item.appendChild(promptInfo);
            
            if (user) {
                const userInfo = document.createElement('div');
                userInfo.className = 'user-info';
                const userAvatar = document.createElement('img');
                userAvatar.src = user.avatar_url || `https://images.websim.com/avatar/${user.username}`;
                const userName = document.createElement('span');
                userName.textContent = `@${user.username}`;
                userInfo.appendChild(userAvatar);
                userInfo.appendChild(userName);
                item.appendChild(userInfo);
            }

            feedContainer.appendChild(item);

            try {
                console.log(`Generating image for prompt: "${prompt}"`);
                const result = await websim.imageGen({
                    prompt: `${prompt}, vertical aspect ratio, cinematic lighting, hyperdetailed, photorealistic`,
                    aspect_ratio: '9:16'
                });

                const img = new Image();
                img.onload = () => {
                    item.style.backgroundImage = `url(${result.url})`;
                    promptInfo.textContent = prompt;
                };
                img.src = result.url;

            } catch (error) {
                console.error('Error generating image:', error);
                item.style.backgroundColor = '#333';
                promptInfo.textContent = `Error: Could not load image for "${prompt}"`;
            }
        }

        async function handleScroll() {
            if (isFetching) return;

            const totalItems = feedContainer.children.length;
            const currentItemIndex = Math.round(feedContainer.scrollTop / window.innerHeight);
            const remainingItems = totalItems - currentItemIndex - 1;

            if (remainingItems < MIN_AHEAD_BUFFER) {
                isFetching = true;
                const itemsToCreate = MIN_AHEAD_BUFFER - remainingItems;
                console.log(`Buffer low (${remainingItems} remaining), creating ${itemsToCreate} new items.`);

                try {
                    if (promptsQueue.length < itemsToCreate) {
                        await fetchPrompts(user, PROMPT_BATCH_SIZE);
                    }
                    
                    for (let i = 0; i < itemsToCreate; i++) {
                        if (promptsQueue.length > 0) {
                            await addFeedItem();
                        } else {
                            console.log("Ran out of prompts while refilling buffer.");
                            break;
                        }
                    }
                } catch (e) {
                    console.error("Failed to add new items on scroll", e);
                } finally {
                    isFetching = false;
                }
            }
        }

        async function main() {
            try {
                user = await websim.getUser();
                if (user) {
                    loadingIndicator.querySelector('p').textContent = `Building your personalized feed, @${user.username}...`;
                }
            } catch (e) {
                console.log("Could not get user, continuing as anonymous.");
            }
            
            await fetchPrompts(user, PROMPT_BATCH_SIZE);

            if (promptsQueue.length === 0) {
              loadingIndicator.querySelector('p').textContent = 'Could not generate feed. Please try again later.';
              loadingIndicator.querySelector('.spinner').style.display = 'none';
              return;
            }
            
            loadingIndicator.classList.add('hidden');

            const itemsToCreate = Math.min(MIN_AHEAD_BUFFER, promptsQueue.length);
            for (let i = 0; i < itemsToCreate; i++) {
               await addFeedItem();
            }

            feedContainer.addEventListener('scroll', handleScroll);
        }

        main();
    </script>

</body>
</html>
