<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Infinite Scroll Feed</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Hide body scrollbars */
            background-color: #111;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        #feed-container {
            width: 100vw;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }

        .feed-item {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            background-color: #222;
            box-shadow: inset 0 0 100px 50px rgba(0,0,0,0.5); /* Vignette effect */
        }

        .feed-item .prompt-info {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 10px;
            margin-bottom: 50px;
            max-width: 80%;
            text-align: center;
            font-size: 1.2rem;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: opacity 0.3s ease-in-out;
        }

        .feed-item .user-info {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .user-info img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            margin-right: 10px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .user-info span {
            font-weight: bold;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
            font-size: 1.5rem;
            transition: opacity 0.5s ease;
        }
        
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="feed-container"></div>
    <div id="loading">
        <div class="spinner"></div>
        <p>Building your personalized feed...</p>
    </div>
    <script type="module">
        const feedContainer = document.getElementById('feed-container');
        const loadingIndicator = document.getElementById('loading');

        const MIN_AHEAD_BUFFER = 7;
        const PROMPT_BATCH_SIZE = 10;

        let isFetching = false;
        let promptsQueue = [];
        let user = null;

        async function getUserInterests(currentUser) {
            if (!currentUser) return 'The user is anonymous. Generate prompts based on generally popular, trending, and visually spectacular creative themes.';

            let userPrompts = [];
            let followedPrompts = [];
            let likedPrompts = [];

            // 1. User's own projects - higher weight
            try {
                const userProjects = await websim.getUserProjects(currentUser.username, { first: 20, posted: true, sort_by: 'updated_at' });
                userProjects.projects.data.forEach(p => {
                    if (p.site && p.site.prompt) {
                        if (p.site.prompt.text) {
                            userPrompts.push(p.site.prompt.text);
                        }
                    }
                    if (p.project.title) userPrompts.push(p.project.title);
                    if (p.project.description) userPrompts.push(p.project.description);
                });
            } catch (e) {
                console.error("Couldn't fetch user projects:", e);
            }

            // 2. Projects from followed users - medium weight
            try {
                const followingResponse = await websim.getUserFollowing(currentUser.username, { first: 10 });
                const followedUsers = followingResponse.following.data.map(f => f.follow.user);

                for (const followedUser of followedUsers) {
                    if (followedUser && followedUser.username) {
                        const followedProjects = await websim.getUserProjects(followedUser.username, { first: 10, posted: true, sort_by: 'updated_at' });
                        followedProjects.projects.data.forEach(p => {
                            if (p.site && p.site.prompt) {
                                if (p.site.prompt.text) {
                                    followedPrompts.push(p.site.prompt.text);
                                }
                            }
                            if (p.project.title) followedPrompts.push(p.project.title);
                            if (p.project.description) followedPrompts.push(p.project.description);
                        });
                    }
                }
            } catch (e) {
                console.error("Couldn't fetch followed users' projects:", e);
            }

            // 3. User's liked projects - lower weight
            try {
                const likedResponse = await websim.getUserLikes(currentUser.username, { first: 15 });
                likedResponse.likes.data.forEach(l => {
                    if (l.site && l.site.prompt) {
                        if (l.site.prompt.text) {
                            likedPrompts.push(l.site.prompt.text);
                        }
                    }
                    if (l.project && l.project.title) likedPrompts.push(l.project.title);
                    if (l.project && l.project.description) likedPrompts.push(l.project.description);
                });
            } catch(e) {
                console.error("Couldn't fetch user likes:", e);
            }

            // Analyze and categorize the collected prompts
            if (userPrompts.length > 0 || followedPrompts.length > 0 || likedPrompts.length > 0) {
                try {
                    const allPrompts = {
                        user_own: [...new Set(userPrompts)].slice(0, 15),
                        followed_users: [...new Set(followedPrompts)].slice(0, 10), 
                        liked_content: [...new Set(likedPrompts)].slice(0, 8)
                    };

                    const completion = await websim.chat.completions.create({
                        messages: [{
                            role: 'system',
                            content: `You are an AI assistant that analyzes user content preferences to extract visual themes, artistic styles, and subject matter preferences. 

Analyze the provided prompts and content from three sources with different weights:
1. USER'S OWN PROJECTS (highest weight) - Their direct creative interests
2. FOLLOWED USERS' PROJECTS (medium weight) - Influences and aspirations  
3. LIKED CONTENT (lower weight) - Passive interests

Extract and categorize:
- Visual themes (cyberpunk, fantasy, nature, abstract, etc.)
- Artistic styles (photorealistic, cartoon, oil painting, digital art, etc.)
- Subject preferences (landscapes, portraits, architecture, animals, etc.)
- Color palettes and moods (dark/bright, warm/cool, etc.)
- Technical elements (lighting, composition, effects)

Respond with a detailed analysis that prioritizes the user's own creative patterns while incorporating influences from their social connections.`
                        }, {
                            role: 'user',
                            content: `Analyze these prompts and content:

USER'S OWN PROJECTS (highest priority):
${allPrompts.user_own.join('\n')}

FOLLOWED USERS' PROJECTS (medium priority):
${allPrompts.followed_users.join('\n')}

LIKED CONTENT (lower priority):
${allPrompts.liked_content.join('\n')}`
                        }],
                    });
                    
                    return `PERSONALIZED FEED ANALYSIS: ${completion.content}

USER PROFILE: Username '@${currentUser.username}', Bio: '${currentUser.description || 'No bio provided'}'

Generate images that align with these analyzed preferences while introducing creative variations and related concepts to keep the feed engaging and fresh.`;
                } catch(e) {
                    console.error("Error analyzing prompt preferences:", e);
                    // Fallback to simpler analysis
                    const combinedPrompts = [...userPrompts, ...followedPrompts, ...likedPrompts];
                    return `Based on ${userPrompts.length} personal projects, ${followedPrompts.length} followed user projects, and ${likedPrompts.length} liked items, the user shows interest in: ${[...new Set(combinedPrompts)].slice(0, 25).join(', ')}.`;
                }
            }

            return `User '@${currentUser.username}' (${currentUser.description || 'No bio'}) hasn't created, liked, or followed anyone with public projects yet. Generate visually stunning and diverse content across popular creative themes: digital art, fantasy landscapes, sci-fi scenes, abstract art, nature photography, architectural marvels, and surreal concepts.`;
        }

        async function fetchPrompts(currentUser, count) {
            console.log('Fetching new personalized prompts...');
            try {
                const userInterestSummary = await getUserInterests(currentUser);
                
                const completion = await websim.chat.completions.create({
                    messages: [{
                        role: 'system',
                        content: `You are a creative prompt generator that creates personalized visual content based on deep user analysis.

${userInterestSummary}

Generate ${count} unique image prompts that:
1. Strongly reflect the user's established visual preferences and themes
2. Introduce creative variations and evolution of their interests  
3. Include some fresh but related concepts to expand their horizons
4. Maintain high visual quality and engagement suitable for a social media feed
5. Use specific artistic and technical language for optimal image generation

Each prompt should be detailed enough to generate stunning, scroll-stopping visuals while staying true to the user's demonstrated preferences.

Respond with JSON: { "prompts": ["detailed prompt 1", "detailed prompt 2", ...] }`
                    }, {
                        role: 'user',
                        content: `Generate ${count} personalized image prompts based on the analysis above.`,
                    }],
                    json: true,
                });

                const result = JSON.parse(completion.content);
                if (result.prompts && Array.isArray(result.prompts)) {
                    promptsQueue.push(...result.prompts);
                    console.log(`Fetched ${result.prompts.length} new personalized prompts based on user's creative history.`);
                }
            } catch (error) {
                console.error('Error fetching personalized prompts:', error);
                // Enhanced fallback prompts with more variety
                promptsQueue.push(
                    "A neon-lit cyberpunk city street in the rain, with flying cars and holographic advertisements",
                    "An enchanted forest with glowing mushrooms, ethereal spirits, and mystical fog",
                    "A majestic dragon soaring over a volcanic landscape at sunset",
                    "An astronaut discovering ancient alien ruins on a distant crystalline planet",
                    "A serene underwater city with bioluminescent architecture and swimming merfolk",
                    "A surrealist dreamscape with floating islands and impossible geometry",
                    "A steampunk airship floating through clouded mountain peaks",
                    "An abstract digital art piece with flowing neon fractals and particle effects"
                );
            }
        }

        async function addFeedItem() {
            if (promptsQueue.length === 0) {
                console.log('Prompt queue is empty, fetching more...');
                await fetchPrompts(user, PROMPT_BATCH_SIZE);
                if (promptsQueue.length === 0) {
                    console.error("Failed to add new item, no prompts available.");
                    return;
                }
            }

            const prompt = promptsQueue.shift();
            if (!prompt) return;

            const item = document.createElement('div');
            item.className = 'feed-item';
            
            const promptInfo = document.createElement('div');
            promptInfo.className = 'prompt-info';
            promptInfo.textContent = 'Generating...';
            item.appendChild(promptInfo);
            
            if (user) {
                const userInfo = document.createElement('div');
                userInfo.className = 'user-info';
                const userAvatar = document.createElement('img');
                userAvatar.src = user.avatar_url || `https://images.websim.com/avatar/${user.username}`;
                const userName = document.createElement('span');
                userName.textContent = `@${user.username}`;
                userInfo.appendChild(userAvatar);
                userInfo.appendChild(userName);
                item.appendChild(userInfo);
            }

            feedContainer.appendChild(item);

            try {
                console.log(`Generating image for prompt: "${prompt}"`);
                const result = await websim.imageGen({
                    prompt: `${prompt}, vertical aspect ratio, cinematic lighting, hyperdetailed, photorealistic`,
                    aspect_ratio: '9:16'
                });

                const img = new Image();
                img.onload = () => {
                    item.style.backgroundImage = `url(${result.url})`;
                    promptInfo.textContent = prompt;
                };
                img.src = result.url;

            } catch (error) {
                console.error('Error generating image:', error);
                item.style.backgroundColor = '#333';
                promptInfo.textContent = `Error: Could not load image for "${prompt}"`;
            }
        }

        async function handleScroll() {
            if (isFetching) return;

            const totalItems = feedContainer.children.length;
            const currentItemIndex = Math.round(feedContainer.scrollTop / window.innerHeight);
            const remainingItems = totalItems - currentItemIndex - 1;

            if (remainingItems < MIN_AHEAD_BUFFER) {
                isFetching = true;
                const itemsToCreate = MIN_AHEAD_BUFFER - remainingItems;
                console.log(`Buffer low (${remainingItems} remaining), creating ${itemsToCreate} new items.`);

                try {
                    if (promptsQueue.length < itemsToCreate) {
                        await fetchPrompts(user, PROMPT_BATCH_SIZE);
                    }
                    
                    for (let i = 0; i < itemsToCreate; i++) {
                        if (promptsQueue.length > 0) {
                            await addFeedItem();
                        } else {
                            console.log("Ran out of prompts while refilling buffer.");
                            break;
                        }
                    }
                } catch (e) {
                    console.error("Failed to add new items on scroll", e);
                } finally {
                    isFetching = false;
                }
            }
        }

        async function main() {
            try {
                user = await websim.getUser();
                if (user) {
                    loadingIndicator.querySelector('p').textContent = `Building your personalized feed, @${user.username}...`;
                }
            } catch (e) {
                console.log("Could not get user, continuing as anonymous.");
            }
            
            await fetchPrompts(user, PROMPT_BATCH_SIZE);

            if (promptsQueue.length === 0) {
              loadingIndicator.querySelector('p').textContent = 'Could not generate feed. Please try again later.';
              loadingIndicator.querySelector('.spinner').style.display = 'none';
              return;
            }
            
            loadingIndicator.classList.add('hidden');

            const itemsToCreate = Math.min(MIN_AHEAD_BUFFER, promptsQueue.length);
            for (let i = 0; i < itemsToCreate; i++) {
               await addFeedItem();
            }

            feedContainer.addEventListener('scroll', handleScroll);
        }

        main();
    </script>

</body>
</html>
